name: Publish to npm (OIDC + provenance)

# Was a DRAFT no-op that only ever ran `npm publish --dry-run`, on the belief
# that OIDC trusted publishing didn't work for these packages. It does — the
# original blocker was a trusted-publisher record bound to the wrong repo, not
# anything about the flow. motion-mcp and morgen-mcp both publish this way.
#
# Requires a trusted publisher on npmjs.com for fidgetcoding-refero-mcp:
#   Settings → Trusted Publisher → GitHub Actions
#   org `fidgetcoding` / repo `refero-design-mcp` / workflow `publish.yml`
#   Environment: blank. Allowed actions: npm publish.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and inspect without publishing'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # npm@latest is 12.x and requires Node >=22.22.2; Node stays pinned at 20
      # so tests run on the engines floor, so pin npm to the 11.x line — the
      # oldest npm with OIDC trusted-publisher support.
      - name: Upgrade npm to 11.x (required for OIDC trusted-publisher auth)
        run: |
          npm install -g npm@^11
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run --provenance --access public

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: true
